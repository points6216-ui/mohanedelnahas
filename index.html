<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mohaned Elnahas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered profile column. Logo, name, handle, four link cards, quiet footer. Palette: navy ground, royal blue light, white type. */
:root{--bg:#12275a;--card:#1b3672;--card-hi:#234590;--line:#3a5a9e;--line-hi:#7aa5ff;--fg:#f5f8ff;--muted:#b2c4ea;--blue:#6a9bff;
--ar:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;--lat:'Space Grotesk','Cairo',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ar);font-size:17px;line-height:1.4;padding-block:56px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#2f5fd6 0%,transparent 62%),var(--bg)}
.bg::before,.bg::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.bg::before{width:60vmax;height:60vmax;left:-25vmax;top:-10vmax;background:radial-gradient(circle,#4a82ff,transparent 65%);animation:float1 20s ease-in-out infinite alternate}
.bg::after{width:50vmax;height:50vmax;right:-22vmax;bottom:-15vmax;background:radial-gradient(circle,#3aa0ff,transparent 65%);opacity:.45;animation:float2 24s ease-in-out infinite alternate}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(120,160,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,160,255,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%)}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:34px}
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.logo{width:124px;height:124px;border-radius:32px;background:#000;border:1px solid var(--line-hi);box-shadow:0 20px 50px -12px rgba(30,80,255,.55),inset 0 1px 0 rgba(255,255,255,.08);display:grid;place-items:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
h1{margin:10px 0 0;font-family:var(--lat);font-weight:700;font-size:2rem;letter-spacing:-.02em;direction:ltr}
.handle{display:inline-flex;align-items:center;gap:8px;font-family:var(--lat);font-weight:500;font-size:.95rem;color:var(--fg);letter-spacing:.02em;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:rgba(27,54,114,.7);direction:ltr;cursor:pointer;transition:border-color .2s,background .2s}
.handle:hover{border-color:var(--line-hi);background:var(--card-hi)}
.handle:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.handle svg{width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.handle.done{border-color:#5fd39a}.handle.done svg{stroke:#5fd39a}
ul{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:12px}
li{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
li:nth-child(2){animation-delay:.07s}li:nth-child(3){animation-delay:.14s}li:nth-child(4){animation-delay:.21s}
a.link{display:flex;align-items:center;gap:16px;padding:12px 14px 12px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--fg);text-decoration:none;font-weight:600;font-size:1.08rem;transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease}
a.link:hover{transform:translateY(-2px);border-color:var(--line-hi);background:var(--card-hi);box-shadow:0 12px 30px -14px rgba(60,120,255,.7)}
a.link:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.ico{flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;background:transparent}
.ico img{display:block;width:100%;height:100%;object-fit:cover}
.name{flex:1;min-width:0}
.go{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(122,165,255,.22);display:grid;place-items:center;transition:background .2s}
a.link:hover .go{background:var(--blue)}
.go svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transform:scaleX(-1)}
footer{font-family:var(--lat);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);direction:ltr}
footer b{color:var(--fg);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float1{to{transform:translate(18vmax,12vmax)}}
@keyframes float2{to{transform:translate(-16vmax,-10vmax)}}
@media (prefers-reduced-motion:reduce){.bg::before,.bg::after,li{animation:none}a.link{transition:none}a.link:hover{transform:none}}
</style>
